name: Flutter Tests

on:
  push:
    branches: [ main, 'cursor/**' ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Install SQLite development library
      run: |
        sudo apt-get update
        sudo apt-get install -y libsqlite3-dev
        ldconfig -p | grep sqlite
    
    - name: Setup Flutter
      uses: subosito/flutter-action@v2
      with:
        channel: 'stable'
        cache: true
    
    - name: Install dependencies
      working-directory: ./app
      run: flutter pub get
    
    - name: Generate Drift code
      working-directory: ./app
      run: dart run build_runner build --delete-conflicting-outputs
    
    - name: Analyze
      working-directory: ./app
      run: flutter analyze
    
    - name: Run scheduling tests
      working-directory: ./app
      run: flutter test test/core/scheduling/ --reporter expanded
    
    - name: Run repository tests
      working-directory: ./app
      run: flutter test test/core/repositories/ --reporter expanded
    
    - name: Run all tests
      working-directory: ./app
      run: flutter test --coverage
